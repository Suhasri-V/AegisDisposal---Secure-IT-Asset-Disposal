services:
  - type: web
    name: aegisdisposal-backend
    env: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@aegisdisposal.local
      - key: ADMIN_PASSWORD_HASH
        value: "$2b$12$K/JGczgFzldwcxDs4jZ9QOLnbIMUhTMii/PHkwRbA7Nl3fkJSKdXq"
      - key: FRONTEND_URL
        value: https://aegis-disposal-secure-it-asset-disp.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://aegisdisposal-secure-it-asset-disposal.onrender.com/api/auth/google/callback

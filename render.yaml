services:
  - type: web
    name: aegisdisposal-api-prod
    env: node
    plan: starter
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    disk:
      name: aegisdisposal-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/server/data
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: suhasri271426@gmail.com
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: FRONTEND_URL
        value: https://aegis-disposal-secure-it-asset-disp.vercel.app
